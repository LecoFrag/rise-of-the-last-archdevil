<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#09080c" />
    <meta name="description" content="Leitor digital da HQ Rise of the Last Archdevil — Os Três Corações." />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>Rise of the Last Archdevil — Os Três Corações</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2309080c'/%3E%3Cpath d='M13 11h28a10 10 0 0 1 10 10v32H23A10 10 0 0 1 13 43V11Z' fill='%23b51f32'/%3E%3Cpath d='M19 17h22a4 4 0 0 1 4 4v25H25a6 6 0 0 1-6-6V17Z' fill='%23f0d9a0'/%3E%3Cpath d='M25 24h14M25 31h14M25 38h10' stroke='%2309080c' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="reader" aria-label="Leitor da história em quadrinhos">
      <section id="stage" class="stage" aria-live="polite">
        <button id="previousButton" class="page-turn page-turn--previous" type="button" aria-label="Página anterior">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div id="book" class="book single" aria-label="Página 1 de 21">
          <figure id="leftPage" class="paper paper--left hidden">
            <img alt="" draggable="false" />
          </figure>
          <figure id="rightPage" class="paper paper--right">
            <img src="pages/page-01.png" alt="Capa da HQ Rise of the Last Archdevil — Os Três Corações" draggable="false" />
          </figure>
        </div>

        <button id="nextButton" class="page-turn page-turn--next" type="button" aria-label="Próxima página">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </section>

      <footer class="controls">
        <button id="layoutButton" class="icon-button desktop-only" type="button" aria-label="Alternar visualização de páginas" title="Alternar páginas simples ou duplas">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5.5h6.5A1.5 1.5 0 0 1 12 7v12H5.5A1.5 1.5 0 0 1 4 17.5v-12Zm16 0h-6.5A1.5 1.5 0 0 0 12 7v12h6.5a1.5 1.5 0 0 0 1.5-1.5v-12Z"/></svg>
        </button>
        <button id="previousCompact" class="compact-button" type="button" aria-label="Página anterior">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="progress-area">
          <label id="pageLabel" for="pageSlider">Capa</label>
          <input id="pageSlider" type="range" min="1" max="21" value="1" aria-label="Ir para uma página" />
          <span id="pageCount">1 / 21</span>
        </div>
        <button id="nextCompact" class="compact-button" type="button" aria-label="Próxima página">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <div class="zoom-controls desktop-only" role="group" aria-label="Controles de zoom">
          <button id="zoomOutButton" class="zoom-button" type="button" aria-label="Afastar imagem" title="Afastar (−)">−</button>
          <button id="zoomFitButton" class="zoom-button zoom-button--fit" type="button" aria-label="Ajustar imagem à tela" title="Ajustar imagem à tela (0)">Ajustar</button>
          <button id="zoomInButton" class="zoom-button" type="button" aria-label="Aproximar imagem" title="Aproximar (+)">+</button>
        </div>
        <button id="fullscreenButton" class="icon-button desktop-only" type="button" aria-label="Abrir em tela cheia" title="Tela cheia">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg>
        </button>
      </footer>
    </main>
    <noscript>Ative o JavaScript para navegar pelas páginas da HQ.</noscript>
    <script src="app.js" defer></script>
  </body>
</html>
